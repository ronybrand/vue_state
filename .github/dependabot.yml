version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # More specific than weekly-batch below (dependabot prefers the more
      # specific group), so vitest and @vitest/coverage-v8 always bump
      # together - they are peer-dependency-locked to the same major, and a
      # standalone bump of one of them breaks `npm ci` with an ERESOLVE conflict.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      # @playwright/test must match the Playwright container image tag used by
      # the e2e job in ci.yml; bump them together and update the tag by hand.
      weekly-batch:
        patterns:
          - '*'
    ignore:
      # typescript-eslint doesn't support TS majors as soon as they ship: its
      # peer range is `>=4.8.4 <6.1.0`, so 6.0.x is fine (the project is on it)
      # and only 6.1.0+ breaks `npm ci`/lint. Kept as a version bound rather
      # than a blanket major ignore, which would also have blocked 6.0.x.
      # Dependabot's npm job failed on exactly this peer conflict.
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'
